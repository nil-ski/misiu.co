<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .Title }}{{ .Title }} - {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ .Description | default site.Params.description }}">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      background: #fff;
      color: #333;
    }
    header { margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
    h1 { color: #2c3e50; }
    .site-title { font-size: 1.5rem; font-weight: bold; text-decoration: none; color: #2c3e50; }
    footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #eee; text-align: center; color: #666; }
  </style>
</head>
<body>
  <header>
    <a href="{{ .Site.BaseURL }}" class="site-title">{{ site.Title }}</a>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; {{ now.Format "2006" }} {{ site.Params.author }}. Built with <a href="https://gohugo.io/">Hugo</a>.</p>
  </footer>
</body>
</html>
